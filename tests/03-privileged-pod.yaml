# Asks for full access to the host. The CIS profile must refuse it.
apiVersion: v1
kind: Pod
metadata:
  name: should-be-rejected
  namespace: smoke
spec:
  hostPID: true
  containers:
    - name: c
      image: busybox:1.36
      command: [sleep, "60"]
      securityContext:
        privileged: true
